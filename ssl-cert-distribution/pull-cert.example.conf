# pull-cert profile
#
# Copy to /etc/pull-cert/<profile>.conf and adjust. The file is sourced by
# bash, so it must be owned by root and not writable by anyone else.
#
# Run with: pull-cert <profile>

# --- Remote ACME host ------------------------------------------------------

# Hostname or IP of the machine holding the certificates. Required.
REMOTE_HOST="certificates.internal"

# SSH user on that host. Its authorized_keys entry decides which certificate
# is served, so nothing needs to be passed on the command line.
REMOTE_USER="acme"

# Optional.
REMOTE_PORT="22"
SSH_KEY="/etc/ssl/acme-pull"
CONNECT_TIMEOUT="15"

# Refuse anything larger than this from the remote side. A certificate bundle
# is a few kilobytes; the limit exists so a compromised or broken ACME host
# cannot fill this machine's disk. 256 KiB by default.
MAX_ARCHIVE_BYTES="262144"

# Extra ssh options, word-split. Rarely needed.
#SSH_OPTIONS="-o StrictHostKeyChecking=yes"

# Optional: refuse to install a certificate that does not cover this name.
# Wildcards are honoured, so "*.example.net" satisfies "id.example.net".
# Catches a wrong authorized_keys entry and a substituted certificate.
#EXPECT_DOMAIN="example.net"

# --- Local destination -----------------------------------------------------

# Where to put the files. Both required. Parent directories are created.
FULLCHAIN_DEST="/etc/nginx/ssl/fullchain.pem"
KEY_DEST="/etc/nginx/ssl/privkey.pem"

# Ownership and permissions of the installed files.
OWNER="root:root"
FULLCHAIN_MODE="0644"
KEY_MODE="0600"

# If the service runs as a non-root user and needs to read the key itself,
# give the key its own ownership, e.g. a group the service belongs to.
#KEY_OWNER="root:ssl-cert"
#KEY_MODE="0640"

# --- Applying the certificate ----------------------------------------------

# Run after installing, before reloading. If it fails, the previous
# certificate is restored and the reload is skipped. Optional but recommended
# wherever the service can validate its own configuration.
TEST_CMD="nginx -t"

# Run after a successful test. Optional - leave empty for services that pick
# up certificate changes on their own, such as authentik's /certs discovery.
RELOAD_CMD="systemctl reload nginx"


# ---------------------------------------------------------------------------
# Further examples
# ---------------------------------------------------------------------------
#
# Caddy:
#   TEST_CMD="caddy validate --config /etc/caddy/Caddyfile"
#   RELOAD_CMD="systemctl reload caddy"
#
# HAProxy:
#   TEST_CMD="haproxy -c -f /etc/haproxy/haproxy.cfg"
#   RELOAD_CMD="systemctl reload haproxy"
#
# Postfix (needs both files readable by root only):
#   TEST_CMD="postfix check"
#   RELOAD_CMD="systemctl reload postfix"
#
# A Docker service reading the files from a bind mount:
#   RELOAD_CMD="docker compose -f /opt/myservice/docker-compose.yml restart web"
#
# nginx inside a container, reloaded without a restart:
#   RELOAD_CMD="docker kill -s HUP myservice-web-1"
#
# authentik - no reload needed, the worker scans /certs every five minutes:
#   FULLCHAIN_DEST="/opt/authentik/certs/id.example.net/fullchain.pem"
#   KEY_DEST="/opt/authentik/certs/id.example.net/privkey.pem"
#   KEY_MODE="0640"
#   TEST_CMD=""
#   RELOAD_CMD=""
